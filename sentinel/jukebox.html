<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1416">
  <title>Jukebox · Escape North Sentinel Island</title>
  <link rel="stylesheet" href="jukebox.css">
  <script type="module" src="src/jukebox.js"></script>
</head>
<body>
  <main id="jukebox">
    <header class="top">
      <h1>Jukebox</h1>
      <p id="status" class="status" aria-live="polite">Audio is off</p>
    </header>

    <button id="unlock" class="unlock" type="button">Tap to enable audio</button>

    <section class="panel" aria-labelledby="mix-title">
      <h2 id="mix-title">Mix</h2>
      <canvas id="meter" class="meter" width="600" height="18" aria-label="Output level"></canvas>
      <div id="mix" class="controls"></div>
    </section>

    <section class="panel" aria-labelledby="tracks-title">
      <h2 id="tracks-title">Tracks</h2>
      <div id="combo" class="combo"></div>
      <div id="tracks"><p class="muted">Loading…</p></div>
    </section>
  </main>
  <noscript><p class="noscript">The jukebox needs JavaScript.</p></noscript>
</body>
</html>
